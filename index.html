<style>
:root{--bg:#faf6f1;--sf:#fff;--tx:#2b1d14;--mu:#7a6a5e;--ac:#8a4b22;--ac2:#f1e4d6;--bd:#e6dccf;--ok:#2e7d32;--er:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:12px 14px 90px}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f0b;--ac:#d9a066;--ac2:#33261c;--hero:#0e0905}}
body{font-family:Inter,system-ui,sans-serif}h1,h2,.serif{font-family:'Playfair Display',Georgia,serif}

#rc{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;padding:20px;overflow:auto}#rc .p{background:#fff;color:#000;max-width:300px;margin:0 auto;padding:14px;font:13px monospace;border-radius:8px}

#q{border-radius:99px;padding:12px 18px;background:var(--sf);margin:0 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.mc{background:var(--sf);border:1px solid var(--bd);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(60,25,5,.08)}
.mc .ph{aspect-ratio:1/1;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}.mc .ph img{width:100%;height:100%;object-fit:cover}

.mc .q{justify-content:space-between;background:var(--ac);color:#fff;border-radius:99px;padding:3px}.mc .q b{font-size:15px}.mc .q button{background:rgba(255,255,255,.22);border-radius:50%;width:30px;height:30px;padding:0;font-size:17px}
.mc.off{opacity:.55}.sold{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:99px;padding:3px 12px;font-size:12px}
.card{border-radius:20px;background:var(--sf)}input,select,textarea{border-radius:14px}

.ft{text-align:center;margin:30px 0 10px;color:var(--mu);font-size:12px;letter-spacing:.18em;text-transform:uppercase}.ft .script{display:block;font-size:34px;letter-spacing:0;text-transform:none;color:var(--ac);line-height:1.1}

:root{--bgimg:url(img/bg.jpg);--bgs:rgba(243,236,225,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bgs:rgba(21,11,5,.88)}}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{background:linear-gradient(rgba(21,11,5,.78),rgba(21,11,5,.9)),var(--bgimg) center/cover no-repeat}}

</style></head><body><div class="w" id="app">Memuat…</div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID'),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={verif:'Menunggu verifikasi',diproses:'Sedang dibuat',siap:'Siap diambil/diantar',selesai:'Selesai',ditolak:'Ditolak'};
const SEED=[
{n:'Chicken Bibimbap',k:'Makanan',p:38000,img:'img/chicken-bibimbap.jpg',e:'🍚'},
{n:'Beef Teppanyaki',k:'Makanan',p:42000,img:'img/beef-teppanyaki.jpg',e:'🍚'},
{n:'Spinach Creamy Chicken',k:'Makanan',p:38000,img:'img/spinach-creamy-chicken.jpg',e:'🍚'},
{n:'Chicken Kungpao',k:'Makanan',p:38000,img:'img/chicken-kungpao.jpg',e:'🍚'},
{n:'Nasi Campur Nusantara',k:'Makanan',p:40000,img:'img/nasi-nusantara.jpg',e:'🍛'},
{n:'Montblanc',k:'Kopi',p:28000,img:'img/montblanc.jpg',e:'☕'},
{n:'Golden Bloom Montblanc',k:'Kopi',p:30000,img:'img/golden-bloom-montblanc.jpg',e:'☕'},
{n:'Snow Rose Montblanc',k:'Kopi',p:30000,img:'img/snow-rose-montblanc.jpg',e:'☕'},
{n:'Paket Iftar (Ramadan)',k:'Paket',p:55000,img:'img/paket-iftar.jpg',e:'🌙',ok:false}];
const DEF={cafe:'Badjoeri Coffee and Eatery',bank:'BCA',rek:'0000000000',an:'Nama Pemilik',qr:'',pinAdmin:'',pinKasir:''};
const S={menu:[],orders:[],cfg:{...DEF}},V={page:'home',cat:'Semua',cart:{},nama:'',meja:'',bukti:'',lock:false,role:null,tab:'orders',edit:null,mode:'lokal'};
const API_URL='PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI';
let store,lastSnap='';
async function api(action,data){const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token:V.token||'',...data})});return r.json()}
async function poll(){
  try{
    const p=await (await fetch(API_URL+'?action=public')).json();
    if(p.ok){S.menu=(p.menu||[]).sort((a,b)=>(a.k||'').localeCompare(b.k||'')||a.n.localeCompare(b.n));S.cfg={...DEF,...p.config}}
    if(V.token){const o=await api('orders');if(o.ok)S.orders=o.orders;else{V.token=null;V.role=null}}
    else{const ids=mine().slice(-20);if(ids.length){const o=await api('myOrders',{ids});if(o.ok)S.orders=o.orders}}
    const snap=JSON.stringify([S.menu,S.cfg,S.orders,V.role]);
    if(snap!==lastSnap){lastSnap=snap;draw()}
  }catch(e){}
}
async function initStore(){
  store={
    put:async(c,id,o)=>{let r;
      if(c==='orders'){const ex=S.orders.find(x=>x.id===id);r=ex?await api('setStatus',{id,status:o.status}):await api('createOrder',{id,order:o})}
      else if(c==='menu')r=await api('saveMenu',{id,item:o});
      else if(c==='app')r=await api('saveConfig',{config:o});
      if(!r||!r.ok){alert((r&&r.error)||'Gagal terhubung ke server');throw new Error('api')}
      await poll();return r},
    del:async(c,id)=>{await api('deleteMenu',{id});await poll()}};
  await poll();
  setInterval(()=>{if(!document.hidden)poll()},5000);
}
const draw=()=>{if(!V.lock)render()};
function route(){const h=location.hash.slice(1);
  if(h==='kasir'||h==='admin'){V.page='staff';V.want=h}
  else{V.page=V.page==='checkout'||V.page==='track'?V.page:'home';const m=h.match(/^meja-?(\d+)$/i);if(m&&!V.meja)V.meja=m[1]}
  render()}
addEventListener('hashchange',()=>{V.role=null;V.page='home';route()});
const mine=()=>{try{return JSON.parse(localStorage.getItem('cafe:mine')||'[]')}catch(e){return[]}};
const cartItems=()=>Object.entries(V.cart).map(([id,q])=>({m:S.menu.find(x=>x.id===id),q})).filter(x=>x.m&&x.q>0);
const total=()=>cartItems().reduce((s,x)=>s+x.m.p*x.q,0);
const thumb=m=>`<div class="img">${m.img?`<img src="${m.img}" alt="">`:esc(m.e||'🍽️')}</div>`;
function render(){
  const a=$('#app');
  if(V.page==='staff')return a.innerHTML=V.role?staffView():loginView();
  if(V.page==='checkout')return a.innerHTML=checkoutView();
  if(V.page==='track')return a.innerHTML=trackView();
  a.innerHTML=homeView();
}
function homeView(){
  const cats=['Semua',...new Set(S.menu.map(m=>m.k).filter(Boolean))],n=cartItems().reduce((s,x)=>s+x.q,0);
  const my=S.orders.filter(o=>mine().includes(o.id)&&o.status!=='selesai');
  return `<div class="top"><h1>☕ ${esc(S.cfg.cafe)}</h1><span class="mu">${V.meja?'Meja '+esc(V.meja):''}</span></div>
  ${my.length?`<div class="card"><b>Pesanan saya</b>${my.map(o=>`<div class="row" style="margin-top:6px"><span class="sp">${esc(o.nama)} · ${rp(o.total)}</span><span class="tag">${ST[o.status]}</span></div>`).join('')}</div>`:''}
  <div class="tabs">${cats.map(c=>`<button class="${c===V.cat?'on':'g'} s" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${S.menu.length?'':'<div class="card mu">Menu belum tersedia. Admin dapat mengisinya lewat #admin.</div>'}
  ${S.menu.filter(m=>V.cat==='Semua'||m.k===V.cat).map(m=>`<div class="card row ${m.ok===false?'off':''}">${thumb(m)}<div class="sp"><b>${esc(m.n)}</b><div class="mu">${esc(m.k||'')}</div><div>${rp(m.p)}</div></div>
   ${m.ok===false?'<span class="tag">Habis</span>':`<div class="q"><button class="g s" data-a="dec" data-v="${m.id}">−</button><b>${V.cart[m.id]||0}</b><button class="s" data-a="inc" data-v="${m.id}">+</button></div>`}</div>`).join('')}
  ${n?`<div class="bar"><button data-a="co">Lihat pesanan (${n}) · ${rp(total())}</button></div>`:''}`;
}
function checkoutView(){
  const c=S.cfg;
  return `<div class="top"><h1>Pembayaran</h1><button class="g s" data-a="back">← Menu</button></div>
  <div class="card">${cartItems().map(x=>`<div class="row"><span class="sp">${x.q}× ${esc(x.m.n)}</span>${rp(x.m.p*x.q)}</div>`).join('')}<hr style="border:0;border-top:1px solid var(--bd)"><div class="row"><b class="sp">Total</b><b>${rp(total())}</b></div></div>
  <div class="card"><label>Nama<input id="nama" value="${esc(V.nama)}" placeholder="Nama kamu"></label><label>Nomor meja<input id="meja" inputmode="numeric" value="${esc(V.meja)}" placeholder="Contoh: 5"></label></div>
  <div class="card"><b>Scan QR untuk membayar ${rp(total())}</b>
  ${c.qr?`<img class="qr" src="${c.qr}" alt="QR pembayaran">`:'<div class="mu">QR belum diunggah admin.</div>'}
  <div class="mu" style="text-align:center">${esc(c.bank)} · ${esc(c.rek)} · a.n. ${esc(c.an)}</div>
  <label>Upload bukti pembayaran<input id="bukti" type="file" accept="image/*"></label>${V.bukti?`<img class="qr" src="${V.bukti}" alt="bukti" style="max-width:140px">`:''}</div>
  <button data-a="send" style="width:100%">Kirim pesanan</button>`;
}
function trackView(){const o=S.orders.find(x=>x.id===V.last);
  return `<h1>Pesanan terkirim ✅</h1><div class="card">${o?`<b>${esc(o.nama)} · Meja ${esc(o.meja)}</b><div>${rp(o.total)}</div><p><span class="tag">${ST[o.status]}</span></p><div class="mu">Kasir akan memverifikasi pembayaran. Pesanan diambil saat dipanggil atau diantar pelayan.</div>${o.note?`<p class="mu">Catatan: ${esc(o.note)}</p>`:''}`:'Memuat…'}</div><button data-a="home" style="width:100%">Pesan lagi</button>`}
function loginView(){return `<div class="w0"><h1>Login ${V.want==='admin'?'Admin':'Kasir'}</h1><div class="card"><label>PIN<input id="pin" type="password" inputmode="numeric" placeholder="PIN"></label><button data-a="login">Masuk</button> <span id="err" class="mu"></span></div><p class="mu">Link pengunjung: halaman utama atau #meja-5 (otomatis isi nomor meja).</p></div>`}
function staffView(){
  const adm=V.role==='admin';
  return `<div class="top"><h1>${adm?'Admin':'Kasir'}</h1><button class="g s" data-a="logout">Keluar</button></div>
  <div class="tabs"><button class="${V.tab==='orders'?'on':'g'} s" data-a="tab" data-v="orders">Pesanan</button>${adm?`<button class="${V.tab==='menu'?'on':'g'} s" data-a="tab" data-v="menu">Menu</button><button class="${V.tab==='set'?'on':'g'} s" data-a="tab" data-v="set">Pengaturan</button>`:''}</div>
  ${V.tab==='orders'?ordersView():V.tab==='menu'?menuAdmin():V.tab==='txt'?txtView():setView()}`;
}
function ordersView(){
  const L=S.orders.filter(o=>o.status!=='selesai'&&o.status!=='ditolak'),D=S.orders.filter(o=>o.status==='selesai'||o.status==='ditolak').slice(0,15);
  const card=o=>`<div class="card"><div class="row"><b class="sp">${esc(o.nama)} · Meja ${esc(o.meja)}</b><span class="tag">${ST[o.status]}</span></div>
   ${o.items.map(i=>`<div class="mu">${i.q}× ${esc(i.n)}</div>`).join('')}<div><b>${rp(o.total)}</b></div>
   ${o.bukti?`<a href="${o.bukti}" target="_blank" rel="noopener"><img src="${o.bukti}" alt="bukti" style="max-height:120px;border-radius:8px;margin:6px 0"></a>`:''}
   <div class="row" style="flex-wrap:wrap">${o.status==='verif'?`<button class="s" data-a="st" data-v="${o.id}|diproses">✔ Pembayaran valid</button><button class="r s" data-a="st" data-v="${o.id}|ditolak">Tolak</button>`:''}
   ${o.status==='diproses'?`<button class="s" data-a="st" data-v="${o.id}|siap">Siap</button>`:''}${o.status==='siap'?`<button class="s" data-a="st" data-v="${o.id}|selesai">Selesai</button>`:''}</div></div>`;
  return `${L.length?L.map(card).join(''):'<div class="card mu">Belum ada pesanan aktif.</div>'}${D.length?'<h2>Riwayat</h2>'+D.map(card).join(''):''}`;
}
function menuAdmin(){
  const e=V.edit;
